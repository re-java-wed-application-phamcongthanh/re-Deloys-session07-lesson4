<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Fundamentals - Trang Chủ Học Viên</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge {
            display: inline-block;
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 9999px;
            margin-bottom: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .info-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .info-value {
            font-weight: 600;
            color: #ffffff;
        }

        .btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: var(--primary);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">● Nginx Reverse Proxy Active</span>
        <h1>Thông Tin Học Viên</h1>
        <p class="subtitle">Báo cáo thực hành Session 07 - Reverse Proxy & Microservices</p>

        <div class="info-group">
            <div class="info-row">
                <span class="info-label">Họ và Tên:</span>
                <span class="info-value">Phạm Công Thành</span>
            </div>
            <div class="info-row">
                <span class="info-label">Mã Lớp:</span>
                <span class="info-value">DevOps-Fundamentals-2026</span>
            </div>
            <div class="info-row">
                <span class="info-label">Trạng Thái Hệ Thống:</span>
                <span class="info-value" style="color: var(--accent);">Ready (HTTP 200)</span>
            </div>
            <div class="info-row">
                <span class="info-label">Backend Proxy API:</span>
                <span class="info-value">http://127.0.0.1:8082/api/</span>
            </div>
        </div>

        <a href="/api/health" class="btn">Kiểm Tra Backend API Status (/api/health)</a>
    </div>
</body>
</html>
