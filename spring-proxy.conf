# ==============================================================================
# Nginx Virtual Host Configuration: spring-proxy.conf
# Description: Reverse Proxy & Static Content Routing for Spring Boot App
# Course: DevOps Fundamentals - Session 07 - Bai 4
# File Path: /etc/nginx/sites-available/spring-proxy.conf
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # 1. Routing for Static Files (Path: /)
    location / {
        root /var/www/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }

    # 2. Reverse Proxy Routing for API Traffic (Path: /api/)
    location /api/ {
        # Forward request to Spring Boot backend running on port 8082
        proxy_pass http://127.0.0.1:8082/;

        # Essential Proxy Headers for Client IP Identification
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection & Timeout Settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Custom Error Pages
    error_page 500 502 503 504 /5x.html;
    location = /5x.html {
        root /usr/share/nginx/html;
    }
}
